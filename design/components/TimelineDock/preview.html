<html lang="en">
<head><meta charset="utf-8"><title>preview</title>

<div class="rs-scene">

<div class="rs-dock">

 <div class="rs-dock__steps">

  <div class="rs-step rs-step--now"><span class="rs-step__mark"></span><span><span class="rs-step__name">Powered descent</span><br><span class="rs-step__time">T-01:52</span></span></div>
  <div class="rs-step"><span class="rs-step__mark"></span><span><span class="rs-step__name">Landing burn</span><br><span class="rs-step__time">T-00:45</span></span></div>
  <div class="rs-step"><span class="rs-step__mark"></span><span><span class="rs-step__name">Touchdown</span><br><span class="rs-step__time">T-00:00</span></span></div>
 </div>
</div></div>
</div>
