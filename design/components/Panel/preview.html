<!-- @dsCard group="Surfaces" height=300 subtitle="Glass panel with title, metric, status and rows" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;height:100%}body{background:var(--scene-ground)}</style></head>
<body>
<div class="rs-scene">
<div class="rs-row">
<section class="rs-panel" style="width:300px">
  <div class="rs-panel__head"><h3 class="rs-panel__title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg> Power supply</h3><button class="rs-icon-btn rs-icon-btn--sm" type="button" aria-label="Open power details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></button></div>
  <div class="rs-metric"><span class="rs-metric__label">Output above demand</span><span class="rs-metric__value">24.6<small>%</small></span></div>
  <span class="rs-chip rs-chip--ok">Stable</span>
  <div class="rs-divider"></div>
  <dl class="rs-kv"><dt>Solar fields</dt><dd>12</dd><dt>Battery banks</dt><dd>6</dd><dt>Reactor module</dt><dd>1</dd></dl>
</section>
<section class="rs-panel rs-panel--compact" style="width:200px">
  <div class="rs-metric"><span class="rs-metric__label">Compact panel</span><span class="rs-metric__value" style="font-size:22px;line-height:26px">-63<small>°C</small></span></div>
  <div class="rs-well"><span class="rs-metric__label">Nested well</span></div>
</section>
</div>
</div>
</body>
</html>
