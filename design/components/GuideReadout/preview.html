<!-- @dsCard group="Scene overlays" height=190 subtitle="Dashed guides across the scene with floating readouts" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;height:100%}body{background:var(--scene-ground)}</style></head>
<body>
<div class="rs-scene">
<div style="position:relative;height:168px">
 <div class="rs-guide" style="position:absolute;left:0;right:0;top:70px"></div>
 <div class="rs-guide rs-guide--v" style="position:absolute;top:0;bottom:0;left:62%"></div>
 <div class="rs-readout" style="position:absolute;left:12px;top:30px"><span class="rs-readout__k">Alt</span><span class="rs-readout__v">1.24 km</span></div>
 <div class="rs-readout" style="position:absolute;left:calc(62% + 10px);top:110px"><span class="rs-readout__k">H/S</span><span class="rs-readout__v">12.6 m/s</span></div>
 <div class="rs-readout" style="position:absolute;right:12px;top:30px;text-align:right"><span class="rs-readout__k">ETA</span><span class="rs-readout__v">01:32</span></div>
</div>
</div>
</body>
</html>
